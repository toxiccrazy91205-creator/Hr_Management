version: "3.9"

services:
  web:
    build: .
    container_name: hr_agent_web
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./media:/app/media
      - ./chroma_db:/app/chroma_db
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=hr_agent_project.settings
    restart: unless-stopped
